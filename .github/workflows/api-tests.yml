name: API Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/api-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.api.config.ts'
      - 'tests/api/**'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/api-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.api.config.ts'
      - 'tests/api/**'
      - 'tsconfig.json'

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
