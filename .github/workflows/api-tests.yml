name: API Tests

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/api-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.api.config.ts'
      - 'tests/api/**'
  pull_request:
    paths:
      - '.github/workflows/api-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.api.config.ts'
      - 'tests/api/**'

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

      - name: Generate ForgeQE HTML summary
        if: always()
        run: node scripts/generate-forgeqe-html-report.mjs --results playwright-report/api/results.json --output report-site/index.html --title "ForgeQE API pipeline report"

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-report
          path: |
            report-site/index.html
            playwright-report/api/
            test-results/
          if-no-files-found: ignore

      - name: Upload hosted ForgeQE API report
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: report-site

  deploy-report:
    if: always()
    needs: api-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy ForgeQE API report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to summary
        run: |
          {
            echo "## ForgeQE API HTML report"
            echo ""
            echo "- [Open single-file report](${{ steps.deployment.outputs.page_url }})"
            echo "- [Open workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"
